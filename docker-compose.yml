services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Docker/Dockerfile.api
    image: pratiteep/pft-api:latest
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app 
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000",
      ]

  streamlit:
    build:
      context: .
      dockerfile: Docker/Dockerfile.streamlit
    image: pratiteep/pft-frontend:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    environment:
      - API_BASE_URL=http://api:8000

volumes:
  pgdata:
